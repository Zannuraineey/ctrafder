[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-engine"
version = "0.1.0"
description = "Local-first AI Multi-Market Trading Intelligence Engine for Deriv cTrader"
readme = "project.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Trading Engine Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "sqlalchemy>=2.0.29",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
]
advanced-ml = [
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.0",
    "optuna>=3.6.0",
    "shap>=0.45.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
